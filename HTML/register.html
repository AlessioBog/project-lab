<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Înregistrare</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/register_style.css">
</head>
<body>
    <main class="page">
        <section class="card">
            <h1>Înregistrează-te</h1>
            <form class="register-form" action="#" method="post" enctype="multipart/form-data">
                <div class="row">
                    <label for="username">Nume utilizator</label>
                    <input type="text" name="username" placeholder="ex: ioanaTW" required>
                </div>
                <div class="row">
                    <label for="email">Email</label>
                    <input type="email" name="email" placeholder="Adresa ta de email" required>
                </div>
                <div class="row two-col">
                    <div>
                        <label for="password">Parolă</label>
                        <input type="password" name="password" required>
                    </div>
                    <div>
                        <label for="confirm_password">Confirmă parola</label>
                        <input type="password" name="confirm_password" required>
                    </div>
                </div>
                <div class="row">
                    <label for="dob">Data nașterii</label>
                    <input type="date" name="dob" required>
                </div>
                <div class="row">
                    <label>Gen</label>
                    <div class="radio-group">
                        <input type="radio" name="gender" value="Masculin"> Masculin
                        <input type="radio" name="gender" value="Feminin"> Feminin
                        <input type="radio" name="gender" value="Altul"> Altul
                    </div>
                </div>
                <div class="row">
                    <label for="country">Țara</label>
                    <select name="country" id="country">
                        <option value="romania">România</option>
                        <option value="moldova">Republica Moldova</option>
                    </select>
                </div>
                <div class="row">
                    <label>Interese</label>
                    <div class="checkbox-grid">
                        <label><input type="checkbox" name="interests" value="html"> HTML</label>
                        <label><input type="checkbox" name="interests" value="css"> CSS</label>
                        <label><input type="checkbox" name="interests" value="js"> JavaScript</label>
                    </div>
                </div>
                <div class="row">
                    <label for="profile_pic">Poză de profil</label>
                    <input type="file" name="profile_pic" id="profile_pic">
                </div>
                <div class="actions">
                    <button type="submit" class="btn primary">Înregistrare</button>
                    <button type="reset" class="btn ghost">Resetare</button>
                </div>
                <p class="login-link"> Ai deja cont? <a href="login.html">Mergi la login</a></p>
            </form>
        </section>
    </main>
</body>
</html>
