<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autentificare</title>
  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="stylesheet" href="../CSS/login_style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-image">
      <img src="../MEDIA/imagine-login.jpg" alt="Imagine login">
    </div>
    <div class="separator"></div>
    <div class="login-form">
      <h2>Autentificare</h2>
      <p class="login-subtitle">Bun venit! Te rugăm să te autentifici.</p>

      <div class="input-group email">
        <input type="email" placeholder="Adresa de email" required>
      </div>

      <div class="input-group password">
        <input type="password" placeholder="Parola" required>
      </div>

      <div class="options-row">
        <label class="remember-me">
          <input type="checkbox">
          <span>Ține-mă minte</span>
        </label>
        <a href="#" class="forgot-link">Ai uitat parola?</a>
      </div>

      <button type="submit" class="login-btn">Autentificare</button>

      <div class="divider">sau</div>

      <p class="register-text">Nu ai cont? <a href="register.html">Înregistrează-te</a></p>
    </div>
  </div>
</body>
</html>
